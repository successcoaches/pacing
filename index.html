<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pacing Calculator , Excel High School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#3a6357; --navy-deep:#2f5248; --gold:#a0784a; --cream:#f8f4ec;
    --ink:#23303f; --muted:#6b7a8d; --line:#e3e9f1; --surface:#fff;
    --good:#2e7d5b; --warn:#c9872f; --alert:#c0504a;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Open Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;padding:20px;}
  .wrap{max-width:560px;margin:24px auto;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(58,99,87,0.08);overflow:hidden;}
  .head{background:var(--navy);color:#fff;padding:26px 28px;}
  .kick{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#d9c7a6;font-weight:600;margin-bottom:5px;}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:700;line-height:1.15;}
  .head p{font-size:13.5px;color:rgba(255,255,255,0.82);margin-top:6px;}
  .body{padding:26px 28px;}
  .field{margin-bottom:18px;}
  label{display:block;font-size:13.5px;font-weight:600;color:var(--navy);margin-bottom:6px;}
  label .hint{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:1px;}
  input[type=number],input[type=date],select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;color:var(--ink);background:#fcfcfd;transition:border-color .15s;}
  input:focus,select:focus{outline:none;border-color:var(--navy);}
  .row{display:flex;gap:14px;}
  .row .field{flex:1;}
  .unit-row{display:flex;gap:10px;align-items:flex-end;}
  .unit-row .field{flex:1;margin-bottom:0;}
  .unit-row .unit{flex:0 0 130px;}
  .btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:6px;transition:background .15s;}
  .btn:hover{background:var(--navy-deep);}
  .result{margin-top:22px;border-top:1px solid var(--line);padding-top:22px;display:none;}
  .result.show{display:block;}
  .big{text-align:center;margin-bottom:18px;}
  .big .num{font-family:'Playfair Display',serif;font-size:44px;font-weight:700;color:var(--navy);line-height:1;}
  .big .lbl{font-size:14px;color:var(--muted);margin-top:6px;}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stat{background:var(--cream);border-radius:10px;padding:14px 16px;}
  .stat .v{font-size:22px;font-weight:700;color:var(--navy);}
  .stat .k{font-size:12px;color:var(--muted);margin-top:2px;}
  .banner{border-radius:10px;padding:13px 16px;margin-top:16px;font-size:13.5px;font-weight:500;}
  .banner.good{background:#e8f3ee;color:var(--good);border-left:3px solid var(--good);}
  .banner.warn{background:#fbf2e3;color:var(--warn);border-left:3px solid var(--warn);}
  .banner.alert{background:#f8e9e8;color:var(--alert);border-left:3px solid var(--alert);}
  .err{color:var(--alert);font-size:13px;margin-top:10px;display:none;}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="kick">Excel High School &amp; Northgate Academy</div>
        <h1>Pacing Calculator</h1>
        <p>Figure out how much to complete each week to finish on time.</p>
      </div>
      <div class="body">

        <div class="unit-row">
          <div class="field">
            <label>What are you tracking?</label>
            <select id="unit">
              <option value="assignments">Assignments</option>
              <option value="modules">Modules</option>
              <option value="lessons">Lessons</option>
              <option value="credits">Credits</option>
              <option value="courses">Courses</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Total to complete
              <span class="hint">in the whole course / plan</span>
            </label>
            <input type="number" id="total" min="0" step="0.5" placeholder="e.g. 40">
          </div>
          <div class="field">
            <label>Already completed
              <span class="hint">done so far</span>
            </label>
            <input type="number" id="done" min="0" step="0.5" placeholder="e.g. 10">
          </div>
        </div>

        <div class="field">
          <label>Target completion date</label>
          <input type="date" id="deadline">
        </div>

        <div class="field">
          <label>Study days per week
            <span class="hint">how many days each week they'll work</span>
          </label>
          <select id="daysweek">
            <option value="7">7 (every day)</option>
            <option value="6">6</option>
            <option value="5" selected>5 (weekdays)</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
          </select>
        </div>

        <button class="btn" onclick="calc()">Calculate Pace</button>
        <div class="err" id="err"></div>

        <div class="result" id="result">
          <div class="big">
            <div class="num" id="perWeek">—</div>
            <div class="lbl" id="perWeekLbl">per week</div>
          </div>
          <div class="stats">
            <div class="stat"><div class="v" id="perDay">—</div><div class="k" id="perDayLbl">per study day</div></div>
            <div class="stat"><div class="v" id="remaining">—</div><div class="k" id="remainingLbl">remaining</div></div>
            <div class="stat"><div class="v" id="weeksLeft">—</div><div class="k">weeks until deadline</div></div>
            <div class="stat"><div class="v" id="daysLeft">—</div><div class="k">calendar days left</div></div>
          </div>
          <div id="banner"></div>
        </div>

      </div>
    </div>
    <div class="foot">For planning use only. Pace assumes steady, even progress.</div>
  </div>

<script>
  // default deadline = end of current school year-ish (next June 1), or 3 months out
  (function(){
    const d = new Date(); d.setMonth(d.getMonth()+3);
    document.getElementById('deadline').value = d.toISOString().slice(0,10);
  })();

  function fmt(n){
    if (!isFinite(n)) return '—';
    return (Math.round(n*10)/10).toString();
  }

  function calc(){
    const unit = document.getElementById('unit').value;
    const total = parseFloat(document.getElementById('total').value);
    const done = parseFloat(document.getElementById('done').value) || 0;
    const deadline = document.getElementById('deadline').value;
    const daysWeek = parseInt(document.getElementById('daysweek').value);
    const err = document.getElementById('err');
    const result = document.getElementById('result');
    err.style.display='none';

    if (isNaN(total) || total<=0){ err.textContent='Please enter the total amount to complete.'; err.style.display='block'; result.classList.remove('show'); return; }
    if (!deadline){ err.textContent='Please choose a target completion date.'; err.style.display='block'; result.classList.remove('show'); return; }

    const remaining = Math.max(total - done, 0);
    const today = new Date(); today.setHours(0,0,0,0);
    const end = new Date(deadline+'T00:00:00');
    const daysLeft = Math.round((end - today)/(1000*60*60*24));

    if (daysLeft <= 0){ err.textContent='The target date is today or in the past. Please choose a future date.'; err.style.display='block'; result.classList.remove('show'); return; }

    const weeksLeft = daysLeft/7;
    const studyDaysTotal = (daysLeft/7)*daysWeek;
    const perWeek = remaining / weeksLeft;
    const perDay = remaining / studyDaysTotal;

    document.getElementById('perWeek').textContent = fmt(perWeek);
    document.getElementById('perWeekLbl').textContent = unit + ' per week';
    document.getElementById('perDay').textContent = fmt(perDay);
    document.getElementById('perDayLbl').textContent = unit+' / study day';
    document.getElementById('remaining').textContent = fmt(remaining);
    document.getElementById('remainingLbl').textContent = unit+' remaining';
    document.getElementById('weeksLeft').textContent = fmt(weeksLeft);
    document.getElementById('daysLeft').textContent = daysLeft;

    // Banner guidance
    const banner = document.getElementById('banner');
    let cls='good', msg='';
    if (remaining===0){
      cls='good'; msg='✓ All done! There is nothing left to complete.';
    } else if (perWeek <= (unit==='credits'||unit==='courses'?0.5:5)){
      cls='good'; msg='This is a comfortable, manageable pace. Steady progress will get there with room to spare.';
    } else if (perWeek <= (unit==='credits'||unit==='courses'?1:10)){
      cls='warn'; msg='This is a solid but focused pace. Staying consistent each week will be important.';
    } else {
      cls='alert'; msg='This is an aggressive pace. It may help to extend the deadline or increase study days per week.';
    }
    banner.className='banner '+cls;
    banner.textContent=msg;

    result.classList.add('show');
  }
</script>
</body>
</html>
